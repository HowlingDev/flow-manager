databaseChangelog:
  - changeSet:
      id: 1-create-table-files
      author: grigoriy
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: file_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: file_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false